[project]
name = "residencial-aurora"
version = "1.0.0"
description = "Assistente virtual do condomínio Residencial Aurora"
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]==2.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "python-dotenv>=1.0.0",
    "truststore>=0.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
